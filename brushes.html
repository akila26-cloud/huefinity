<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUEFINITY | Brushes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #29232f;
            --muted: #766c7b;
            --pink: #d1257b;
            --purple: #8e238e;
            --cream: #fffaf5;
            --border: #f0e6df;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cream);
            color: var(--ink);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 22px;
            padding: 14px 3.5%;
            background-color: #fff;
            border-bottom: 1px solid var(--border);
            min-height: 100px;
        }

        .logo {
            flex: 0 0 90px;
            width: 90px;
        }

        .logo img {
            display: block;
            width: 100%;
            height: 68px;
            max-width: 90px;
            object-fit: contain;
        }

        .search-box {
            display: flex;
            align-items: center;
            flex: 0 1 440px;
            width:  440px;
            max-width:  440px;
            min-width: 220px;
            height: 44px;
            position: relative;
            top: 9px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #e5d9e7;
            border-radius: 28px;
            background: #fff;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: #a46ac4;
            box-shadow: 0 0 0 3px rgba(164, 106, 196, 0.12);
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0 16px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--ink);
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #918797;
        }

        .search-box button {
            width: 48px;
            height: 100%;
            border: none;
            background: var(--ink);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--purple);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex: 0 0 auto;
            flex-wrap: nowrap;
            gap: clamp(10px, 1.05vw, 18px);
            white-space: nowrap;
            align-self: center;
            transform: translateY(8px);
        }

        nav a {
            text-decoration: none;
            color: #282c3f;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 650;
            text-transform: uppercase;
            letter-spacing: 0.35px;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--pink);
        }

        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 22px;
            flex: 0 0 auto;
            align-self: center;
            position: relative;
            top: 8px;
        }

        .header-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-width: 54px;
            color: #282c3f;
            text-decoration: none;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }

        .header-action .action-icon {
            display: block;
            width: 28px;
            height: 28px;
            line-height: 1;
        }

        .header-action .action-icon svg {
            display: block;
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-action:hover {
            color: var(--pink);
        }

        .hero {
            text-align: center;
            padding: 85px 20px;
            background: linear-gradient(135deg, #fff0f5, #f0eaff, #eaf8ff);
        }

        .hero h1 {
            font-size: clamp(34px, 5vw, 48px);
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 30px;
            font-size: 18px;
            color: #655b6c;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background-color: var(--ink);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.2s, transform 0.2s;
        }

        .button:hover {
            background: var(--purple);
            transform: translateY(-2px);
        }

        .categories {
            padding: 55px 7%;
            text-align: center;
        }

        .categories h2,
        .products h2 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .categories > p,
        .products-intro {
            color: var(--muted);
            margin-bottom: 30px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        .category {
            background-color: #fff;
            padding: 30px 15px;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .category:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(41, 35, 47, 0.08);
        }

        .category .icon {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .category h3 {
            margin-bottom: 8px;
        }

        .category p {
            font-size: 14px;
            color: var(--muted);
        }

        .products {
            padding: 50px 7% 65px;
            text-align: center;
            scroll-margin-top: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: minmax(0, 760px);
            justify-content: center;
            gap: 30px;
            margin: 30px auto 0;
        }

        .product-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 28px;
            width: 100%;
            padding: 24px;
            text-align: left;
            background: #fff;
            border: 1px solid #eee0d8;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .product-gallery {
            min-width: 0;
        }

        .main-image-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            padding: 12px;
            background: #fffafc;
            border-radius: 12px;
        }

        .main-image-container > img {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: contain;
            margin: 0 auto;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(41, 35, 47, 0.85);
            color: #fff;
            cursor: pointer;
        }

        .left-arrow {
            left: 8px;
        }

        .right-arrow {
            right: 8px;
        }

        .thumbnail-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

.product-details {
            min-width: 0;
            align-self: center;
        }

        .brand-name {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 6px;
        }

        .product-details h3 {
            font-size: 23px;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .rating {
            color: #d99b00;
            margin-bottom: 12px;
        }

        .rating span {
            color: var(--muted);
            font-size: 13px;
        }

        .product-price {
            font-size: 25px;
            font-weight: bold;
            color: var(--purple);
            margin: 10px 0 0;
        }

        .mrp {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 14px;
        }

        .mrp span {
            color: #21834a;
            margin-left: 6px;
        }

        .product-description {
            margin: 14px 0;
        }

        .product-features {
            padding-left: 20px;
            margin: 12px 0;
        }

        .product-features li {
            margin-bottom: 5px;
        }

        .demo-note {
            color: var(--muted);
            font-size: 12px;
            margin-top: 12px;
        }

        .cart-button {
            margin-top: 14px;
            padding: 12px 22px;
            border: none;
            border-radius: 25px;
            background: var(--ink);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cart-button:hover {
            background: var(--purple);
        }

        .no-results {
            display: none;
            margin-top: 20px;
            color: var(--muted);
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: var(--ink);
            color: #fff;
            font-size: 14px;
        }

        @media (max-width: 1100px) {
            header {
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 14px 20px;
                padding: 12px 5%;
            }

            nav {
                order: 3;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px 22px;
                transform: none;
            }

            .search-box {
                flex: 1 1 280px;
                max-width: 420px;
                margin-left: 0;
                margin-right: 0;
            }

            .header-actions {
                gap: 12px;
            }
        }

        @media (max-width: 900px) {
            .category-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            header {
                padding: 12px 5%;
            }

            .logo img {
                height: 60px;
            }

            .search-box {
                flex: 1 1 100%;
                width: 100%;
                max-width: 100%;
                order: 3;
                margin: 0;
            }

            nav {
                order: 2;
                width: 100%;
                justify-content: center;
                gap: 12px 18px;
            }

            .header-actions {
                order: 4;
                width: 100%;
                justify-content: center;
            }

            nav a {
                font-size: 12px;
            }

            .hero {
                padding: 65px 18px;
            }

            .hero p {
                font-size: 16px;
            }

            .categories,
            .products {
                padding: 42px 5%;
            }

            .category-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .category {
                padding: 24px 10px;
            }

            .product-card {
                grid-template-columns: 1fr;
                padding: 16px;
            }

            .main-image-container,
            .main-image-container > img {
                min-height: 230px;
                height: 230px;
            }

            .product-details h3 {
                font-size: 21px;
            }
        }
    
        .subcategory-page {
            min-height: 62vh;
            padding: 0 0 70px;
            background: #fffaf6;
        }
        .category-banner {
            width: 100%;
            height: clamp(220px, 30vw, 380px);
            background-image: url("images/brushes-banner.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .subcategory-heading { display: none; }
        .category-note { margin: 38px auto 0; width: min(780px, 90%); }
        .subcategory-heading {
            text-align: center;
            margin: 0 auto 34px;
        }
        .subcategory-heading h1 {
            color: var(--ink);
            font-size: clamp(30px, 3vw, 40px);
            margin: 0 0 12px;
        }
        .subcategory-heading p {
            color: var(--muted);
            font-size: 16px;
            margin: 0;
        }
        .subcategory-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
            max-width: 1250px;
            margin: 0 auto;
        }
        .subcategory-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-height: 210px;
            padding: 26px 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .subcategory-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(40, 32, 45, .08);
            border-color: #e4c8e8;
        }
        .subcategory-icon {
            display: grid;
            place-items: center;
            width: 56px;
            height: 56px;
            margin-bottom: 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fff0f7, #eef3ff);
            font-size: 29px;
        }
        .subcategory-card h2 {
            margin: 0 0 9px;
            font-size: 19px;
        }
        .subcategory-card p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55;
        }
        .category-note {
            max-width: 780px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
            color: var(--muted);
            text-align: center;
        }
        @media (max-width: 950px) {
            .subcategory-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 560px) {
            .subcategory-page { padding: 36px 5% 50px; }
            .subcategory-grid { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>
    <header>
        <a class="logo" href="index.html" aria-label="HUEFINITY home">
            <img src="logo.png" alt="HUEFINITY logo">
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="paints.html">Paints</a>
            <a href="pastels.html">Pastels</a>
            <a href="markers.html">Markers</a>
            <a href="pencils.html">Pencils</a>
            <a href="brushes.html">Brushes</a>
        </nav>
        <div class="search-box">
            <input type="search" id="searchInput" placeholder="Search for paints, brushes and more" aria-label="Search art supplies">
            <button type="button" onclick="searchSubcategories()" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions" aria-label="Account and shopping shortcuts">
            <a class="header-action" href="#" onclick="showDemoMessage('Profile'); return false;">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4"></circle><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"></path></svg></span><span>Profile</span>
            </a>
            <a class="header-action" href="#" onclick="showDemoMessage('Wishlist'); return false;">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.1-8.8 11-8.8 11S3.2 13.9 3.2 8.8A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"></path></svg></span><span>Wishlist</span>
            </a>
            <a class="header-action" href="#" onclick="showDemoMessage('Bag'); return false;">
                <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg></span><span>Bag</span>
            </a>
        </div>
    </header>
        <main class="subcategory-page">
            <div class="category-banner" role="img" aria-label="Brushes art supplies category banner"></div>
            <div class="subcategory-heading">
                <h1>Brushes</h1>
                <p>Find the right tools to bring your ideas to life.</p>
            </div>
            <div class="category-note">
                <p>Brush types will be added here in the next step.</p>
            </div>
        </main>
    <footer>HUEFINITY &copy; 2026 | Where Colors Never End.</footer>
    <script>
        function showDemoMessage(feature) {
            alert(feature + " is a demo feature and is not connected yet.");
        }
        function searchSubcategories() {
            const input = document.getElementById("searchInput");
            const grid = document.getElementById("subcategoryGrid");
            if (!grid) return;
            const term = input.value.trim().toLowerCase();
            const cards = grid.querySelectorAll(".subcategory-card");
            let shown = 0;
            cards.forEach(card => {
                const match = card.textContent.toLowerCase().includes(term);
                card.style.display = match ? "flex" : "none";
                if (match) shown++;
            });
            const noResults = document.getElementById("noResults");
            if (noResults) noResults.style.display = shown ? "none" : "block";
        }
        const searchInput = document.getElementById("searchInput");
        if (searchInput) {
            searchInput.addEventListener("keydown", event => {
                if (event.key === "Enter") searchSubcategories();
            });
        }
    </script>
</body>
</html>
